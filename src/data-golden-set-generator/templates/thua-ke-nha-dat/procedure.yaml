# Hồ sơ thừa kế nhà đất: bộ giấy tờ ở AIP-027 mục 4.2.
# [CẦN XÁC NHẬN] Thủ tục chính xác (thừa kế hay đăng ký biến động) và giấy tờ bắt buộc: câu hỏi mở ở AIP-027 mục 5.

procedure: thua-ke-nha-dat
title: Đăng ký biến động nhà đất do nhận thừa kế
legal_basis:
  - "[CẦN XÁC NHẬN] Luật Đất đai 2024; Nghị định 101/2024/NĐ-CP"

# Người nộp là một người con của người đứng tên nhà đất đã mất.
# people: inheritance -> dựng thêm người mất, vợ/chồng, các con, hộ khẩu, bên bán đất, người làm chứng (generator/people.py)
# và thửa đất dùng chung (generator/property.py).
people: inheritance
persona:
  age: [25, 70]
  gender: any

submit_date: ["2025-07-01", "2026-06-30"]

documents:
  - doc_type: can-cuoc                  # Của người nộp. Thế hệ thẻ theo ngày cấp
    required: true
  - doc_type: giay-chung-tu             # Mẫu theo thời kỳ: giấy chứng tử (trước 2016) / trích lục khai tử
    required: true
  - doc_type: giay-chung-nhan-nha-dat   # Mẫu cũ, 4 trang
    required: true
  - doc_type: ban-ve-hien-trang
    required: true
  - doc_type: to-dang-ky-nha-dat        # Giấy tờ cũ, đánh máy hoặc viết tay
    required: true
  - doc_type: so-ho-khau
    required: true
  - doc_type: giay-sang-dat             # Viết tay, không có mẫu
    required: true

# Mỗi hồ sơ là một tập dữ liệu: cùng một nhóm người, luôn đủ 7 giấy tờ.
# Mỗi hồ sơ nhận một kịch bản biến thể (dossier.plan), xoay vòng để các biến thể xuất hiện đều nhau;
# cứ 36 hồ sơ (3 x 3 x 2 x 2) thì phủ hết mọi tổ hợp. Kịch bản và biến thể đạt được ghi ở ground_truth.json > profile.
# knob: cách generator điều hướng để ra đúng biến thể
#   persona.card    ép thế hệ thẻ của người nộp (ngày cấp trong khoảng của thế hệ đó)
#   people.nam_mat  ép thời kỳ người đứng tên mất (quyết định mẫu giấy chứng tử và dòng xóa tên trong sổ hộ khẩu)
#   variant         chọn thẳng biến thể ngẫu nhiên của giấy tờ (đánh máy / viết tay)
coverage:
  - name: the
    knob: persona.card
    values:
      cccd-ma-vach: {can-cuoc: cccd-ma-vach}
      cccd-chip: {can-cuoc: cccd-chip}
      the-can-cuoc: {can-cuoc: the-can-cuoc}
  - name: nam_mat
    knob: people.nam_mat
    values:
      truoc-2016: {giay-chung-tu: giay-chung-tu, so-ho-khau: da-xoa-ten}
      2016-2022: {giay-chung-tu: trich-luc-khai-tu, so-ho-khau: da-xoa-ten}
      tu-2023: {giay-chung-tu: trich-luc-khai-tu, so-ho-khau: chua-xoa-ten}
  - name: gcn
    knob: variant
    values:
      danh-may: {giay-chung-nhan-nha-dat: danh-may}
      viet-tay: {giay-chung-nhan-nha-dat: viet-tay}
  - name: to_dang_ky
    knob: variant
    values:
      danh-may: {to-dang-ky-nha-dat: danh-may}
      viet-tay: {to-dang-ky-nha-dat: viet-tay}

rules:
  - id: R02
    text: Thông tin người để lại di sản phải khớp giữa các giấy tờ
  - id: R03
    text: Thông tin thửa đất trên giấy chứng nhận và bản vẽ hiện trạng phải khớp nhau
  - id: R04
    text: Giấy tờ tùy thân của người nộp phải còn giá trị
  - id: R05
    text: Người để lại di sản phải mất trước ngày nộp hồ sơ
  - id: R06
    text: Người nộp phải từ đủ 18 tuổi

mix:
  valid: 0.5
  invalid: 0.5

# Không có ca thiếu giấy tờ (missing_document): mỗi tập dữ liệu luôn đủ 7 giấy tờ.
# Ca lỗi chỉ sửa giá trị trên giấy tờ, hoặc dựng người nộp ngoài điều kiện.
mutations:
  - id: M02
    kind: field_conflict          # Họ tên người mất trên giấy chứng tử khác các giấy tờ khác (AIP entity matching)
    weight: 2
    params: {doc_type: giay-chung-tu, field: ho_ten, perturb: typo_name}
    expect: {decision: request_supplement, rule: R02}

  - id: M03
    kind: field_conflict          # Năm sinh chủ hộ (người mất) trong sổ hộ khẩu lệch
    weight: 1
    params: {doc_type: so-ho-khau, field: tv1_ngay_sinh, perturb: year_shift}
    expect: {decision: request_supplement, rule: R02}

  - id: M04
    kind: field_conflict          # Diện tích trên bản vẽ hiện trạng lệch giấy chứng nhận
    weight: 2
    params: {doc_type: ban-ve-hien-trang, field: dien_tich, perturb: area_shift}
    expect: {decision: request_supplement, rule: R03}

  - id: M05
    kind: persona_override        # Người nộp còn dùng CMND 9 số, đã hết giá trị từ 01/01/2025
    weight: 1
    params: {card: cmnd-9, age: [35, 70]}
    expect: {decision: request_supplement, rule: R04}

  - id: M06
    kind: date_order              # Ngày mất ghi sau ngày nộp
    weight: 1
    params: {doc_type: giay-chung-tu, field: ngay_mat, after: dossier.submit_date}
    expect: {decision: request_supplement, rule: R05}

  - id: M07
    kind: persona_override
    weight: 1
    params: {age: [15, 17]}
    expect: {decision: reject, rule: R06}
