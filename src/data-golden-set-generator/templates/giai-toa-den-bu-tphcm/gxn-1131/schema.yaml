doc_type: gxn-1131
version: 1
title: Giấy xác nhận nguồn gốc, thời điểm sử dụng đất (GXN 1131)
# [CẦN XÁC NHẬN] Chưa có mẫu "1131" thật. Dựng theo nội dung UBND cấp xã thường xác nhận khi lập phương án bồi thường:
# nguồn gốc, thời điểm bắt đầu sử dụng đất, tình trạng tranh chấp, sự phù hợp quy hoạch.
source_form: "[CẦN XÁC NHẬN] Mẫu GXN 1131. Bố cục dựng theo nội dung xác nhận thường gặp"
pages: 1

issue_date:
  source: thu_hoi.ngay_gxn

# Đánh máy toàn bộ, hoặc mẫu in sẵn được cán bộ điền tay.
variants:
  cases:
    - {name: danh-may, weight: 0.7}
    - {name: dien-tay, weight: 0.3}

render:
  page: a4
  paper: white
  age: [0, 0.1]

fields:
  - {name: co_quan, label: UBND cấp xã, type: organization, source: thu_hoi.co_quan, transform: upper, fill: printed}
  - {name: so_van_ban, label: Số, type: text, source: thu_hoi.so_gxn, fill: printed, by_variant: {dien-tay: {fill: handwritten}}}
  - {name: nguoi_de_nghi, label: Người đề nghị xác nhận, type: person_name, source: people.nguoi_nop.ho_ten, fill: printed,
     by_variant: {dien-tay: {fill: handwritten}}}
  - {name: so_cccd, label: Số định danh người đề nghị, type: id_number, source: persona.cccd, fill: printed,
     by_variant: {dien-tay: {fill: handwritten}}}
  - {name: quan_he, label: Quan hệ với người sử dụng đất, type: text, gen: const, params: {value: Con}, fill: printed,
     by_variant: {dien-tay: {fill: handwritten}}}
  - {name: nguoi_su_dung, label: Người sử dụng đất, type: person_name, source: people.nguoi_mat.ho_ten, transform: upper,
     fill: printed, by_variant: {dien-tay: {fill: handwritten}}}
  - {name: nam_sinh, label: Năm sinh người sử dụng đất, type: year, source: people.nguoi_mat.ngay_sinh.year, fill: printed,
     by_variant: {dien-tay: {fill: handwritten}}}
  - {name: ngay_mat, label: Ngày mất, type: date, source: timeline.ngay_mat, fill: printed,
     by_variant: {dien-tay: {fill: handwritten}}}
  - name: dia_chi_thua_dat
    label: Địa chỉ thửa đất
    type: address
    gen: address_at
    params: {source: property.dia_chi_parts}
    fill: printed
    by_variant: {dien-tay: {fill: handwritten}}
  - {name: so_thua, label: Thửa đất số, type: text, source: property.so_thua, fill: printed, by_variant: {dien-tay: {fill: handwritten}}}
  - {name: to_ban_do, label: Tờ bản đồ số, type: text, source: property.to_ban_do, fill: printed, by_variant: {dien-tay: {fill: handwritten}}}
  - {name: dien_tich, label: Diện tích đang sử dụng, type: area, source: property.dien_tich, format: vn_decimal, suffix: " m²",
     fill: printed, by_variant: {dien-tay: {fill: handwritten}}}
  - {name: muc_dich, label: Mục đích sử dụng, type: text, source: property.muc_dich, fill: printed,
     by_variant: {dien-tay: {fill: handwritten}}}

  # Nội dung xác nhận: nhãn chính, đối chiếu giấy sang đất (R07)
  - name: nguon_goc
    label: Nguồn gốc sử dụng đất
    type: free_text
    gen: template
    params: {text: "Nhận chuyển nhượng của {people.ben_ban.xung_ho} {people.ben_ban.ho_ten} bằng giấy tay, sử dụng để ở từ đó đến nay"}
    fill: printed
    by_variant: {dien-tay: {fill: handwritten}}
  - {name: thoi_diem_su_dung, label: Thời điểm bắt đầu sử dụng đất, type: date, source: timeline.ngay_sang, fill: printed,
     by_variant: {dien-tay: {fill: handwritten}}}
  - {name: tranh_chap, label: Tình trạng tranh chấp, type: text, gen: const, params: {value: Không tranh chấp}, fill: printed,
     by_variant: {dien-tay: {fill: handwritten}}}
  - name: quy_hoach
    label: Sự phù hợp quy hoạch
    type: text
    gen: const
    params: {value: "Phù hợp quy hoạch khu dân cư tại thời điểm bắt đầu sử dụng; không vi phạm hành lang bảo vệ công trình"}
    fill: printed
    by_variant: {dien-tay: {fill: handwritten}}

  - {name: ngay_ky, label: Ngày ký, type: date, source: doc.issue_date, format: "ngày %d tháng %m năm %Y", fill: printed}
  - {name: chuc_vu_ky, label: Chức vụ người ký, type: text, gen: choice,
     params: {values: [CHỦ TỊCH, "KT. CHỦ TỊCH - PHÓ CHỦ TỊCH"]}, fill: printed}
  - {name: nguoi_ky, label: Người ký, type: person_name, gen: person_name, fill: printed}

decorations:
  - {kind: signature, anchor: nguoi_ky}
  - {kind: stamp, anchor: nguoi_ky}
