  - {name: ngay_qd, label: Ngày quyết định, type: date, source: doc.issue_date, format: "ngày %d tháng %m năm %Y", fill: printed}
  - {name: ten_du_an, label: Dự án, type: text, source: thu_hoi.ten_du_an, fill: printed}
  - {name: so_qd_thu_hoi, label: Quyết định thu hồi đất số, type: text, source: thu_hoi.so_qd, fill: printed}
  - {name: ngay_qd_thu_hoi, label: Ngày quyết định thu hồi, type: date, source: thu_hoi.ngay_qd, fill: printed}
  - {name: han_ban_giao, label: Thời hạn bàn giao mặt bằng, type: date, source: thu_hoi.han_ban_giao, fill: printed}
