  - {name: nguoi_duoc_thuong, label: Người được thưởng, type: person_name, source: people.nguoi_nop.ho_ten, fill: printed}
  - name: dai_dien_cho
    label: Đại diện cho
    type: text
    gen: template
    params: {text: "những người thừa kế của {people.nguoi_mat.xung_ho} {people.nguoi_mat.ho_ten}"}
