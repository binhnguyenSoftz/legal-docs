doc_type: khen-thuong
version: 1
title: Quyết định thưởng bàn giao mặt bằng đúng hạn
source_form: "[CẦN XÁC NHẬN] Quyết định hành chính của UBND cấp xã, một hộ một quyết định"
pages: 1

issue_date:
  source: thu_hoi.ngay_qd_thuong

render:
  page: a4
  paper: white
  age: [0, 0.08]

# Nhãn suy luận (QĐ 11/2026 TP.HCM, R11): chỉ có khi ngay_ban_giao <= han_ban_giao.
#   thu hồi toàn bộ: so_tien = min(tiền bồi thường đất, 50.000.000)
