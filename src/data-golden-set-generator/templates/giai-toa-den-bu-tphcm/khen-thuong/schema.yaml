  - {name: so_tien, label: Số tiền thưởng, type: money, source: thu_hoi.tien_thuong, format: vn_group, suffix: " đồng", fill: printed}
  - {name: so_tien_bang_chu, label: Bằng chữ, type: money_words, source: thu_hoi.tien_thuong, format: vn_words, suffix: " đồng",
