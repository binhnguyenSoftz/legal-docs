doc_type: tai-dinh-cu
version: 1
title: Quyết định bố trí tái định cư
source_form: "[CẦN XÁC NHẬN] Quyết định của UBND cấp xã giao căn hộ / nền đất tái định cư hoặc hỗ trợ tự lo chỗ ở"
pages: 1

issue_date:
  source: thu_hoi.ngay_qd_tdc

# Hộ không đủ điều kiện thì không có giấy này (procedure.yaml: when).
variants:
  by: thu_hoi.tdc.hinh_thuc
  cases:
    - {name: can-ho, equals: can-ho}
    - {name: nen-dat, equals: nen-dat}
    - {name: tu-lo-cho-o, equals: tu-lo-cho-o}

render:
  page: a4
  paper: white
  age: [0, 0.08]

# Nhãn suy luận (R12):
#   ho_tro_suat_toi_thieu = max(0, gia_suat_toi_thieu - tiền bồi thường đất)    (QĐ 11/2026 TP.HCM)
#   chênh lệch = gia - tiền bồi thường đất - ho_tro_suat_toi_thieu: dương -> tien_phai_nop, âm -> tien_duoc_nhan
#   tự lo chỗ ở: ho_tro_tu_lo = 5% tiền bồi thường đất [CẦN XÁC NHẬN]
# so_nhan_khau khớp số người còn sống trong sổ hộ khẩu.
fields:
  - {name: co_quan, label: UBND cấp xã, type: organization, source: thu_hoi.co_quan, transform: upper, fill: printed}
  - {name: so_qd, label: Số quyết định, type: text, source: thu_hoi.so_qd_tdc, fill: printed}
  - {name: ngay_qd, label: Ngày quyết định, type: date, source: doc.issue_date, format: "ngày %d tháng %m năm %Y", fill: printed}
  - {name: ten_du_an, label: Dự án, type: text, source: thu_hoi.ten_du_an, fill: printed}
  - {name: so_qd_thu_hoi, label: Quyết định thu hồi đất số, type: text, source: thu_hoi.so_qd, fill: printed}
  - {name: ngay_qd_thu_hoi, label: Ngày quyết định thu hồi, type: date, source: thu_hoi.ngay_qd, fill: printed}
  - {name: nguoi_duoc_bo_tri, label: Người được bố trí, type: person_name, source: people.nguoi_nop.ho_ten, fill: printed}
  - {name: so_cccd, label: Số định danh, type: id_number, source: persona.cccd, fill: printed}
  - name: dai_dien_cho
    label: Đại diện cho
    type: text
    gen: template
    params: {text: "hộ {people.nguoi_mat.xung_ho} {people.nguoi_mat.ho_ten} (đã chết)"}
    fill: printed
  - name: dia_chi_thu_hoi
    label: Địa chỉ nhà đất bị thu hồi
    type: address
    gen: address_at
    params: {source: property.dia_chi_parts}
    fill: printed
  - {name: so_nhan_khau, label: Số nhân khẩu, type: number, source: dossier.compensation.nhan_khau, fill: printed}
  - {name: hinh_thuc, label: Hình thức tái định cư, type: text, source: thu_hoi.tdc.ten, fill: printed}
  - {name: tien_bt_dat, label: Tiền bồi thường về đất, type: money, source: thu_hoi.tien_bt_dat, format: vn_group,
     suffix: " đồng", fill: printed}

  # Căn hộ / nền đất
  - {name: khu, label: Khu tái định cư, type: text, source: thu_hoi.tdc.khu, fill: printed, variants: [can-ho, nen-dat]}
  - {name: block, label: Lô (block), type: text, source: thu_hoi.tdc.block, fill: printed, variants: [can-ho]}
  - {name: tang, label: Tầng, type: number, source: thu_hoi.tdc.tang, fill: printed, variants: [can-ho]}
  - {name: so_can, label: Căn hộ số, type: text, source: thu_hoi.tdc.so_can, fill: printed, variants: [can-ho]}
  - {name: lo, label: Lô, type: text, source: thu_hoi.tdc.lo, fill: printed, variants: [nen-dat]}
  - {name: so_nen, label: Nền số, type: text, source: thu_hoi.tdc.so_nen, fill: printed, variants: [nen-dat]}
  - {name: dien_tich_tdc, label: Diện tích, type: area, source: thu_hoi.tdc.dien_tich, format: vn_decimal, suffix: " m²",
     fill: printed, variants: [can-ho, nen-dat]}
  - {name: don_gia_tdc, label: Đơn giá, type: money, source: thu_hoi.tdc.don_gia, format: vn_group, suffix: " đồng/m²",
     fill: printed, variants: [can-ho, nen-dat]}
  - {name: gia_tdc, label: Giá trị suất tái định cư, type: money, source: thu_hoi.tdc.gia, format: vn_group, suffix: " đồng",
     fill: printed, variants: [can-ho, nen-dat]}
  - {name: tien_phai_nop, label: Số tiền phải nộp thêm, type: money, source: thu_hoi.tdc.tien_phai_nop, format: vn_group,
     suffix: " đồng", fill: printed, variants: [can-ho, nen-dat]}
  - {name: tien_duoc_nhan, label: Số tiền được nhận lại, type: money, source: thu_hoi.tdc.tien_duoc_nhan, format: vn_group,
     suffix: " đồng", fill: printed, variants: [can-ho, nen-dat]}

  # Cả 3 biến thể
  - {name: gia_suat_toi_thieu, label: Giá trị suất tái định cư tối thiểu, type: money, source: thu_hoi.tdc.gia_suat_toi_thieu,
     format: vn_group, suffix: " đồng", fill: printed}
  - {name: ho_tro_suat_toi_thieu, label: Hỗ trợ đủ suất tái định cư tối thiểu, type: money,
     source: thu_hoi.tdc.ho_tro_suat_toi_thieu, format: vn_group, suffix: " đồng", fill: printed}

  # Tự lo chỗ ở
  - {name: ho_tro_tu_lo, label: Hỗ trợ tự lo chỗ ở, type: money, source: thu_hoi.tdc.ho_tro_tu_lo, format: vn_group,
     suffix: " đồng", fill: printed, variants: [tu-lo-cho-o]}

  - {name: chuc_vu_ky, label: Chức vụ người ký, type: text, gen: choice,
     params: {values: [CHỦ TỊCH, "KT. CHỦ TỊCH - PHÓ CHỦ TỊCH"]}, fill: printed}
  - {name: nguoi_ky, label: Người ký, type: person_name, gen: person_name, fill: printed}

decorations:
  - {kind: signature, anchor: nguoi_ky}
  - {kind: stamp, anchor: nguoi_ky}
