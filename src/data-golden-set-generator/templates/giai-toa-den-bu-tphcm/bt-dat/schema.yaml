doc_type: bt-dat
version: 1
title: Bảng chiết tính bồi thường, hỗ trợ về đất
source_form: "[CẦN XÁC NHẬN] Bảng chi tiết kèm quyết định phê duyệt phương án bồi thường (mỗi địa phương một mẫu)"
pages: 1

# Phê duyệt cùng ngày quyết định thu hồi đất.
issue_date:
  source: thu_hoi.ngay_qd

render:
  page: a4l
  paper: white
  age: [0, 0.08]

# Nhãn suy luận: tong_cong = Σ thanh_tien; thanh_tien = dien_tich × don_gia × ty_le (R10). dien_tich ≤ diện tích thu hồi (R09).
fields:
  - {name: co_quan, label: UBND cấp xã, type: organization, source: thu_hoi.co_quan, transform: upper, fill: printed}
  - {name: ten_du_an, label: Dự án, type: text, source: thu_hoi.ten_du_an, fill: printed}
  - {name: so_qd, label: Kèm theo quyết định số, type: text, source: thu_hoi.so_qd, fill: printed}
  - {name: ngay_qd, label: Ngày quyết định, type: date, source: thu_hoi.ngay_qd, fill: printed}
  - {name: chu_su_dung, label: Chủ sử dụng, type: person_name, source: people.nguoi_mat.ho_ten, transform: upper, fill: printed}
  - {name: nguoi_nhan, label: Người đại diện nhận tiền, type: person_name, source: people.nguoi_nop.ho_ten, fill: printed}
  - {name: so_cccd, label: Số định danh người nhận, type: id_number, source: persona.cccd, fill: printed}
  - name: ghi_chu_dai_dien
    label: Tư cách đại diện
    type: text
    gen: template
    params: {text: "Đại diện những người thừa kế của {people.nguoi_mat.xung_ho} {people.nguoi_mat.ho_ten} (đã chết)"}
    fill: printed
  - name: dia_chi_thua_dat
    label: Địa chỉ thửa đất
    type: address
    gen: address_at
    params: {source: property.dia_chi_parts}
    fill: printed
  - {name: so_thua, label: Thửa đất số, type: text, source: property.so_thua, fill: printed}
  - {name: to_ban_do, label: Tờ bản đồ số, type: text, source: property.to_ban_do, fill: printed}
  - {name: dien_tich_gcn, label: Diện tích theo giấy chứng nhận, type: area, source: property.dien_tich, format: vn_decimal,
     suffix: " m²", fill: printed}
  - {name: dien_tich_thu_hoi, label: Diện tích thu hồi, type: area, source: thu_hoi.dien_tich, format: vn_decimal,
     suffix: " m²", fill: printed}
  - {name: pham_vi, label: Phạm vi thu hồi, type: text, source: thu_hoi.pham_vi_text, fill: printed}

  - {name: tong_cong, label: Tổng cộng, type: money, source: thu_hoi.tien_bt_dat, format: vn_group, fill: printed}
  - {name: tong_bang_chu, label: Bằng chữ, type: money_words, source: thu_hoi.tien_bt_dat, format: vn_words, suffix: " đồng",
     fill: printed}

  - {name: ngay_lap, label: Ngày lập, type: date, source: doc.issue_date, format: "ngày %d tháng %m năm %Y", fill: printed}
  - {name: nguoi_lap, label: Người lập, type: person_name, gen: person_name, fill: printed}
  - {name: nguoi_kiem_tra, label: Người kiểm tra, type: person_name, gen: person_name, fill: printed}
  - {name: chuc_vu_duyet, label: Chức vụ người duyệt, type: text, gen: choice,
     params: {values: [CHỦ TỊCH, "KT. CHỦ TỊCH - PHÓ CHỦ TỊCH"]}, fill: printed}
  - {name: nguoi_duyet, label: Người duyệt, type: person_name, gen: person_name, fill: printed}

# Mỗi dòng bảng tính: d1_noi_dung, d1_dien_tich...
groups:
  - name: d
    items: thu_hoi.dat
    max: 4
    fields:
      - {name: noi_dung, label: Nội dung, type: text, source: item.noi_dung, fill: printed}
      - {name: dien_tich, label: Diện tích (m²), type: area, source: item.dien_tich, format: vn_decimal, fill: printed}
      - {name: don_gia, label: Đơn giá (đ/m²), type: money, source: item.don_gia, format: vn_group, fill: printed}
      - {name: ty_le, label: Tỷ lệ bồi thường, type: percent, source: item.ty_le, suffix: "%", fill: printed}
      - {name: thanh_tien, label: Thành tiền (đ), type: money, source: item.thanh_tien, format: vn_group, fill: printed}

decorations:
  - {kind: signature, anchor: nguoi_duyet}
  - {kind: stamp, anchor: nguoi_duyet}
